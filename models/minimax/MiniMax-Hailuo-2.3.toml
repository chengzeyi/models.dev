# Released 2025-10-28: https://www.minimax.io/news/minimax-hailuo-23
# Image formats JPG, JPEG, PNG, WebP: https://platform.minimax.io/docs/api-reference/video-generation-i2v.md
# Output: MP4.
schema = 2
v2_only = true
type = "video"
name = "MiniMax Hailuo 2.3"
description = "Text- and image-to-video model with stronger motion, stylization and micro-expressions"
family = "minimax"
open_weights = false
release_date = "2025-10-28"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp"]
output = ["video/mp4"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
